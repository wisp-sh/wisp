name: Source compiler acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_manifest_url:
        description: Public HTTPS URL of the five-bundle acquisition manifest
        required: false
        type: string
      bundle_manifest_sha256:
        description: SHA-256 of the exact acquisition manifest bytes
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: source-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acquisition-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check the public library workflow client
        run: python3 -m unittest discover -s tests/library-ci -v
      - name: Check native release packaging
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - name: Reject modified compiler inputs and mutable CLI snapshots
        run: python3 -m unittest discover -s tests/source-build -p 'test_*.py'
      - name: Check bounded diagnostic collection
        run: python3 -m unittest discover -s tools/ci-evidence -p 'test_*.py'
  python-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the exact Python Component runtime
        run: python3 -m pip install --only-binary=':all:' wasmtime==48.0.0
      - name: Require real generated-wheel execution without skips
        run: |
          python3 - <<'PY'
          import importlib.metadata
          import sys
          import unittest
          assert importlib.metadata.version('wasmtime') == '48.0.0'
          sys.path.insert(0, 'tests/library-ci')
          suite = unittest.defaultTestLoader.loadTestsFromName(
              'test_ci.PythonWheelTests.test_installed_wheel_executes_real_component')
          assert suite.countTestCases() == 1
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 1 or result.skipped or not result.wasSuccessful():
              raise SystemExit('Real Wasmtime wheel execution must pass exactly once without skips')
          PY
  source-build:
    # Compiler releases are not public yet. Push/PR runs exercise the bounded
    # acquisition contract; only an explicit dispatch runs compiler acceptance.
    # Remove this condition after publishing and pinning the five release inputs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container:
      image: debian:13.4-slim@sha256:109e2c65005bf160609e4ba6acf7783752f8502ad218e298253428690b9eaa4b
    timeout-minutes: 360
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/x86_64-linux-gnu-gcc-14
      CC: /usr/bin/x86_64-linux-gnu-gcc-14
      CXX: /usr/bin/x86_64-linux-gnu-g++-14
      AR: /usr/bin/x86_64-linux-gnu-ar
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.98.1
      WISP_SOURCE_MANIFEST_URL: ${{ inputs.bundle_manifest_url || vars.WISP_SOURCE_TOOLCHAIN_MANIFEST_URL }}
      WISP_SOURCE_MANIFEST_SHA256: ${{ inputs.bundle_manifest_sha256 || vars.WISP_SOURCE_TOOLCHAIN_MANIFEST_SHA256 }}
    steps:
      - name: Require published pinned compiler inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WISP_SOURCE_MANIFEST_URL" || {
            echo 'Set WISP_SOURCE_TOOLCHAIN_MANIFEST_URL and WISP_SOURCE_TOOLCHAIN_MANIFEST_SHA256 repository variables, or provide workflow_dispatch inputs. See docs/verification/source-build-ci.md.' >&2
            exit 1
          }
          [[ "$WISP_SOURCE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Bootstrap the pinned Linux builder
        shell: bash
        run: |
          set -euo pipefail
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          printf '%s\n' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260503T000000Z trixie main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260503T000000Z trixie-updates main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260503T000000Z trixie-security main' \
            > /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils=2.44-3 ca-certificates curl gcc-14=14.2.0-19 g++-14 git gzip \
            libc6-dev=2.41-12+deb13u2 rustup=1.27.1-3+b1 xz-utils \
            python3 python3-venv clangd-19 cmake make pkg-config patch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the locked Wisp CLI and worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/source-build
          bash scripts/bootstrap-linux-builder.sh > evidence/source-build/bootstrap.log 2>&1
          rustup toolchain install 1.99.0 --profile minimal > evidence/source-build/host-rust-install.log 2>&1
          export PATH="$HOME/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu/bin:$PATH"
          cargo build --locked -p wisp -p wisp-worker > evidence/source-build/cli-build.log 2>&1
          echo "WISP_WORKER=$PWD/target/debug/wisp-worker" >> "$GITHUB_ENV"
          echo "$HOME/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
          echo 'WISP_CLANGD=/usr/bin/clangd-19' >> "$GITHUB_ENV"
      - name: Download, verify and install all compilers into a fresh prefix
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .tools/source-build
          python3 tests/source-build/setup.py \
            --manifest-url "$WISP_SOURCE_MANIFEST_URL" \
            --manifest-sha256 "$WISP_SOURCE_MANIFEST_SHA256" \
            --cli target/debug/wisp --prefix "$PWD/.tools/source-build" \
            --cache "$PWD/.downloads/source-build" --evidence "$PWD/evidence/source-build" \
            2>&1 | tee evidence/source-build/setup.log
      - name: Compile inferred and authored APIs and execute Component consumers
        shell: bash
        run: |
          set -euo pipefail
          source .tools/source-build/acceptance-env.sh
          export CARGO_TARGET_DIR="$PWD/target"
          python3 tests/source-build/ci.py --cli target/debug/wisp \
            --prefix .tools/source-build --setup-evidence evidence/source-build \
            --out out/source-build-ci \
            2>&1 | tee evidence/source-build/acceptance.log
          python3 - <<'PY'
          import json
          result = json.load(open('out/source-build-ci/result.json'))
          assert result['status'] == 'passed' and result['complete'] and result['cleanInstallVerified'], result
          PY
      - name: Collect bounded source build diagnostics
        if: always()
        run: python3 tools/ci-evidence/collect.py --group source-build --output evidence/upload-source-build
      - name: Save source build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-build-linux-amd64-evidence
          path: evidence/upload-source-build/
          if-no-files-found: warn
          retention-days: 7
