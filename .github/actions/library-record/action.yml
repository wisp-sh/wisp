name: Record Wisp library build
description: Send hashes of inert library artifacts to Wisp from a fresh OIDC-enabled runner
inputs:
  artifact-id:
    description: Immutable GitHub artifact ID produced by this run's build job
    required: true
  artifact-digest:
    description: SHA-256 digest GitHub reported for that artifact
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        WISP_ACTION_ROOT: ${{ github.action_path }}/../../..
        WISP_ARTIFACT_ID: ${{ inputs.artifact-id }}
        WISP_ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
      run: python3 -I "$WISP_ACTION_ROOT/scripts/ci/record.py" --artifacts "$RUNNER_TEMP/wisp-artifacts"
