name: Publish Wisp library packages
description: Plan or upload release archives to the owner's registries with trusted publishing
inputs:
  command:
    description: plan, npm, cargo, or pypi (verify and stage missing wheels for a caller-side upload)
    required: true
  wheels-directory:
    description: Fresh wheel output directory, relative to the workspace so the PyPA Docker action can read it
    default: wisp-wheels
outputs:
  npm:
    description: Whether any package declares an npm target
    value: ${{ steps.run.outputs.npm }}
  cargo:
    description: Whether any package declares a crates.io target
    value: ${{ steps.run.outputs.cargo }}
  pypi:
    description: Whether PyPI is declared (plan) or has missing verified wheels to upload (pypi)
    value: ${{ steps.run.outputs.pypi }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        WISP_ACTION_ROOT: ${{ github.action_path }}/../../..
        WISP_COMMAND: ${{ inputs.command }}
        WISP_WHEELS: ${{ inputs.wheels-directory }}
      run: |
        case "$WISP_COMMAND" in plan|npm|cargo|pypi) ;; *) echo "unknown publish command" >&2; exit 1 ;; esac
        python3 -I "$WISP_ACTION_ROOT/scripts/ci/publish.py" "$WISP_COMMAND" --artifacts "$RUNNER_TEMP/wisp-artifacts" --wheels "$WISP_WHEELS"
